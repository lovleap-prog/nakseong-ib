<title>낙성 탐구 설계실</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F4F6F1; --surface:#FFFFFF; --sunk:#EBEEE7; --ink:#1B2530; --muted:#5A6570; --faint:#8A949C;
  --line:#D9DED4; --line-strong:#B9C1B5; --accent:#2E5E4E; --accent-ink:#FFFFFF; --accent-soft:#DCE9E2;
  --ok:#2F7A4F; --ok-soft:#DDEFE3; --warn:#9A6400; --warn-soft:#F7EAD0; --bad:#B03A2E; --bad-soft:#F6DCD8;
  --wwa:#B85540; --wwapt:#A87A1F; --hweo:#80509A; --htww:#2F6AA0; --hwoo:#2F8068; --stp:#5B8428;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#141A1D; --surface:#1B2226; --sunk:#10151A; --ink:#E6EAE4; --muted:#A3AEB3; --faint:#76828A;
  --line:#2C353A; --line-strong:#434E54; --accent:#7FC0A6; --accent-ink:#0F1A16; --accent-soft:#1F3A31;
  --ok:#7CCB9A; --ok-soft:#1C3527; --warn:#E3B45A; --warn-soft:#3A2F17; --bad:#EE8B7F; --bad-soft:#3E211D;
  --wwa:#E08A74; --wwapt:#D6AE5A; --hweo:#B78DD0; --htww:#78A9D8; --hwoo:#6FC0A5; --stp:#9CC46A;
}}
:root[data-theme="dark"]{
  --ground:#141A1D; --surface:#1B2226; --sunk:#10151A; --ink:#E6EAE4; --muted:#A3AEB3; --faint:#76828A;
  --line:#2C353A; --line-strong:#434E54; --accent:#7FC0A6; --accent-ink:#0F1A16; --accent-soft:#1F3A31;
  --ok:#7CCB9A; --ok-soft:#1C3527; --warn:#E3B45A; --warn-soft:#3A2F17; --bad:#EE8B7F; --bad-soft:#3E211D;
  --wwa:#E08A74; --wwapt:#D6AE5A; --hweo:#B78DD0; --htww:#78A9D8; --hwoo:#6FC0A5; --stp:#9CC46A;
}
*{box-sizing:border-box}
[hidden]{display:none!important} /* 숨긴 창(확인 창·알림)이 display 규칙 때문에 화면을 덮지 않도록 */
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.3}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:600}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 6px}
.brand h1{font-size:19px;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:7px 10px;border-radius:var(--r);display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink)}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav .dot{width:8px;height:8px;border-radius:2px;flex:none;background:var(--faint)}
.nav .meta{margin-left:auto;font-size:11px;color:var(--faint)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.sync{display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync[data-s="live"] i{background:var(--ok)}
.sync[data-s="saving"] i{background:var(--warn)}
.sync[data-s="err"] i{background:var(--bad)}
.sync[data-s="err"]{color:var(--bad)}
.main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
.topbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin-bottom:22px}
.topbar h2{font-size:26px}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:4px}
.topbar .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.menu-btn{display:none}

/* controls */
.btn{border:1px solid var(--line-strong);background:var(--surface);padding:7px 13px;border-radius:var(--r);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;line-height:1.5}
textarea{resize:vertical;min-height:64px}
input:hover,select:hover,textarea:hover{border-color:var(--line-strong)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field .hint{font-size:12px;color:var(--faint)}
.row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;user-select:none}
.chip:hover{border-color:var(--line-strong)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.chip small{color:inherit;opacity:.65;margin-left:4px}

/* unit workspace */
.work{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:600}
.tabs .n{font-family:var(--f-mono);font-size:11px;margin-left:5px;color:var(--faint)}
.sec{display:flex;flex-direction:column;gap:18px;margin-bottom:34px}
.sec-h{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.sec-h h3{font-size:17px}
.sec-h .en{font-size:12px;color:var(--faint);font-family:var(--f-mono)}
.sec-h .tools{margin-left:auto;display:flex;gap:6px}
.theme-band{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);background:var(--sunk);border-left:4px solid var(--tc,var(--faint))}
.theme-band b{font-family:var(--f-display);font-size:15px}
.theme-band p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.ci{font-family:var(--f-display);font-size:18px;line-height:1.55;min-height:92px}
.loi{display:grid;grid-template-columns:44px minmax(0,1fr) 150px;gap:10px;align-items:start}
.loi .tag{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:9px}
.cq{font-size:12px;color:var(--muted);margin-top:4px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:none}
td input,td select,td textarea{border-color:transparent;background:transparent;padding:5px 6px}
td textarea{min-height:36px}
td input:hover,td select:hover,td textarea:hover{border-color:var(--line)}
.num{width:64px;text-align:right}
.grasps{display:grid;grid-template-columns:36px 150px minmax(0,1fr);gap:10px 12px;align-items:start}
.grasps .L{font-family:var(--f-display);font-size:22px;color:var(--accent);line-height:1.2;padding-top:4px}
.grasps .N{font-size:13px;font-weight:600;padding-top:6px}
.grasps .N small{display:block;font-weight:400;color:var(--faint);font-size:11.5px;line-height:1.4}

/* check panel */
.panel{position:sticky;top:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.score{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.score b{font-family:var(--f-mono);font-size:30px;font-weight:500}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-bottom:14px}
.meter i{display:block;height:100%;background:var(--accent)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.checks li{display:grid;grid-template-columns:18px 1fr;gap:8px;padding:6px 4px;font-size:12.5px;line-height:1.45;border-radius:4px;cursor:pointer}
.checks li:hover{background:var(--sunk)}
.checks .ic{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;margin-top:1px}
.checks [data-l="ok"] .ic{background:var(--ok-soft);color:var(--ok)}
.checks [data-l="warn"] .ic{background:var(--warn-soft);color:var(--warn)}
.checks [data-l="bad"] .ic{background:var(--bad-soft);color:var(--bad)}
.checks small{display:block;color:var(--faint)}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.ex{background:var(--warn-soft);color:var(--warn)}

/* POI */
.poi-wrap{overflow-x:auto;padding-bottom:6px}
.poi{display:grid;grid-template-columns:70px repeat(6,minmax(170px,1fr));gap:6px;min-width:1100px}
.poi .th{padding:10px 10px 12px;border-top:4px solid var(--tc);background:var(--surface);border-radius:0 0 var(--r) var(--r)}
.poi .th b{font-family:var(--f-display);font-size:14px;display:block;line-height:1.35}
.poi .th span{font-size:11px;color:var(--faint);font-family:var(--f-mono)}
.poi .gh{font-family:var(--f-display);font-size:15px;padding:10px 4px;color:var(--muted)}
.cell{min-height:118px;border:1px dashed var(--line-strong);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px}
.cell .add{all:unset;cursor:pointer;margin:auto;font-size:12px;color:var(--faint);padding:6px 10px;border-radius:4px}
.cell .add:hover{color:var(--accent);background:var(--accent-soft)}
.ucard{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:5px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--tc);border-radius:var(--r);padding:9px 10px}
.ucard:hover{border-color:var(--line-strong);border-left-color:var(--tc)}
.ucard b{font-size:13.5px;line-height:1.4}
.ucard p{margin:0;font-size:12px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ucard .foot{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.cc{font-size:10.5px;padding:0 6px;border-radius:3px;background:var(--sunk);color:var(--muted)}
.balance{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:30px}
.bal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.bal h3{font-size:15px;margin-bottom:10px}
.heat{display:grid;gap:3px;font-size:11.5px}
.heat .h{color:var(--muted);text-align:center;font-size:11px}
.heat .rl{color:var(--muted);white-space:nowrap}
.heat .v{height:26px;border-radius:3px;display:grid;place-items:center;font-family:var(--f-mono);background:var(--sunk);color:var(--faint)}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:120px 1fr 26px;gap:8px;align-items:center;font-size:12.5px}
.bar .t{height:10px;background:var(--sunk);border-radius:2px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent)}
.bar .c{font-family:var(--f-mono);text-align:right;color:var(--muted)}

/* reference */
.ref{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.ref .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;container-type:inline-size}
.ref .box h3{font-size:15px;margin-bottom:10px}
/* 이름 칸이 설명 칸을 밀어내지 않도록 너비 상한을 둠 (긴 이름은 줄바꿈) */
.ref dl{margin:0;display:grid;grid-template-columns:fit-content(38%) minmax(0,1fr);gap:7px 12px;font-size:12.5px;align-items:start}
.ref dt{font-weight:600;word-break:keep-all}
.ref dd{margin:0;color:var(--muted);line-height:1.6;word-break:keep-all}
/* 칸이 아주 좁으면 이름 아래에 설명을 둠 */
@container (max-width:330px){
  .ref dl{grid-template-columns:minmax(0,1fr);gap:1px}
  .ref dd{margin:0 0 9px}
  .ref dd:last-child{margin-bottom:0}
}
/* 설명이 긴 목록은 넓은 화면에서 두 칸 차지 */
@media (min-width:1180px){.ref .box.wide{grid-column:span 2}}
.stage{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.stage:last-child{border:none}
.stage .k{font-family:var(--f-mono);color:var(--faint)}

.coach{background:var(--sunk);border-radius:var(--r);padding:14px 16px;white-space:pre-wrap;font-size:13.5px;line-height:1.7;max-width:72ch}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:var(--r)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:8px 16px;border-radius:var(--r);font-size:13px;z-index:50}
.list{display:flex;flex-direction:column;gap:8px}
.list .ucard{flex-direction:row;align-items:center;gap:14px}
.list .ucard .g{font-family:var(--f-display);color:var(--muted);width:44px}

.toast{display:flex;align-items:center;gap:14px}
.toast button{all:unset;cursor:pointer;font-weight:600;color:var(--accent-soft);text-decoration:underline;text-underline-offset:3px}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,20,24,.45);display:grid;place-items:center;padding:16px}
.modal-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(460px,100%);padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.modal-card h3{font-size:18px}
.modal-body{display:flex;flex-direction:column;gap:12px;color:var(--muted);font-size:13.5px}
.modal-body b{color:var(--ink)}
.modal-body ul{margin:0;padding-left:18px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
.tabbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:-8px 0 20px;font-size:12.5px;color:var(--faint)}
.tabbar .btn{margin-left:auto}
.mtable td{vertical-align:middle}
.mtable .acts{white-space:nowrap;text-align:right}
/* 안내 모드 · AI */
.need{font-size:10.5px;font-weight:600;letter-spacing:0;padding:0 6px;border-radius:3px;margin-left:4px;vertical-align:1px}
.need.req{background:var(--accent-soft);color:var(--accent)}
.need.opt{background:var(--sunk);color:var(--faint)}
.guide{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;background:var(--accent-soft);border-radius:var(--r);padding:14px 18px;margin-bottom:26px;font-size:13px}
.guide ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.guide p{margin:0;color:var(--ink);align-self:center;line-height:1.65}
.note{margin:0;font-size:12.5px;color:var(--muted);line-height:1.6;max-width:80ch}
details.more{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.more>summary{cursor:pointer;padding:10px 14px;font-size:13px;color:var(--muted);list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"＋ ";color:var(--accent)}
details.more[open]>summary::before{content:"－ "}
details.more .more-body{padding:4px 14px 14px;display:flex;flex-direction:column;gap:14px}
.panel details.more{margin-top:12px;border:none;background:none}
.panel details.more>summary{padding:6px 0}
.frames{display:flex;flex-direction:column;gap:6px}
.frames .chip{font-family:var(--f-display);text-align:left;border-radius:var(--r)}
.ci-live{display:flex;flex-wrap:wrap;gap:6px;min-height:22px}
.tabs .step{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--sunk);font-family:var(--f-mono);font-size:10.5px;margin-right:6px;color:var(--muted)}
.tabs [aria-selected="true"] .step{background:var(--accent);color:var(--accent-ink)}
.nextbar{display:flex;justify-content:flex-end;padding-top:8px;border-top:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;width:max-content;max-width:100%}
.seg button{all:unset;cursor:pointer;padding:6px 14px;font-size:13px}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--ground)}
.pgrid{display:grid;grid-template-columns:170px 1fr;gap:8px}
.btn.ai{border-color:transparent;background:var(--sunk);color:var(--accent);font-weight:600}
.btn.ai:hover{background:var(--accent-soft)}
.no-ai .btn.ai,.no-ai [data-act="coach"],.no-ai .ai-only{display:none}
/* 드롭다운 메뉴 (AI 도움 · 더보기) */
details.aimenu{position:relative;display:inline-block}
details.aimenu>summary{list-style:none}
details.aimenu>summary::-webkit-details-marker{display:none}
details.aimenu>summary.btn{background:var(--sunk);border-color:transparent;color:var(--accent);font-weight:600}
.aimenu-list{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:250px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:6px;display:flex;flex-direction:column}
details.aimenu.right .aimenu-list{left:auto;right:0}
.aimenu-list button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-radius:6px;font-size:13px}
.aimenu-list button:hover,.aimenu-list button:focus-visible{background:var(--sunk)}
.aimenu-list small{color:var(--faint);font-size:11.5px}
.aimenu-list .danger b{color:var(--bad)}
/* 처음 안내 */
.welcome{position:relative;display:flex;gap:16px;background:var(--accent-soft);border-radius:10px;padding:16px 20px;margin-bottom:20px}
.welcome h3{font-size:16px;margin-bottom:6px}
.welcome ol{margin:0 0 12px;padding-left:20px;font-size:13px;line-height:1.7}
.welcome .close{position:absolute;top:8px;right:8px}
/* 추천 예시 카드 · 지도 */
.starter{border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface);text-align:left}
.starter h4{font-family:var(--f-display);font-size:18px;margin:2px 0}
.st-lead{font-size:12px;color:var(--muted)}
.st-ci{margin:0;font-family:var(--f-display);font-size:15px;line-height:1.6}
